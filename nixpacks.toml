# Nixpacks config for NAK AI Detector
# WeasyPrint needs these system libs for PDF generation

[phases.setup]
nixPkgs = ["python311", "pango", "cairo", "gdk-pixbuf", "libffi", "libxml2", "libxslt", "nodejs", "gcc", "gnumake"]

[phases.install]
cmds = ["pip install -r requirements.txt", "npm config set prefix /opt/npm-global && npm install -g @dodona/dolos"]

[start]
cmd = "bash start.sh"
