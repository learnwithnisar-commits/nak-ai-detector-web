# Nixpacks config for NAK AI Detector
# WeasyPrint needs these system libs for PDF generation
# NOTE (2026-10-23): nixpkgs python311 quirks —
#   * no pip binary -> install phase bootstraps a venv (per Railway diagnosis).
#   * no CA certificates -> cacert in nixPkgs + SSL_CERT_FILE export so pip's
#     TLS to PyPI verifies. (python311Packages.pip removed: it collides with
#     python311 in the nix profile and breaks nix-env setup.)

[phases.setup]
nixPkgs = ["python311", "cacert", "pango", "cairo", "gdk-pixbuf", "libffi", "libxml2", "libxslt"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip --version",
  "if [ -f /root/.nix-profile/etc/ssl/certs/ca-bundle.crt ]; then export SSL_CERT_FILE=/root/.nix-profile/etc/ssl/certs/ca-bundle.crt; fi; /opt/venv/bin/pip install --upgrade pip",
  "if [ -f /root/.nix-profile/etc/ssl/certs/ca-bundle.crt ]; then export SSL_CERT_FILE=/root/.nix-profile/etc/ssl/certs/ca-bundle.crt; fi; /opt/venv/bin/pip install -r requirements.txt",
]
paths = ["/opt/venv/bin"]

[start]
cmd = "bash start.sh"
