# Nixpacks config for NAK AI Detector
# WeasyPrint needs these system libs for PDF generation
# NOTE (2026-10-23): nixpkgs python311 is broken for our build (no pip binary;
# python311Packages.pip collides in nix-env; cacert causes nss-cacert file
# collisions). Python now comes from Ubuntu apt (working ensurepip + system CA
# certs); only the WeasyPrint system libs stay on nix.

[phases.setup]
aptPkgs = ["python3", "python3-pip", "python3-venv", "ca-certificates"]
nixPkgs = ["pango", "cairo", "gdk-pixbuf", "libffi", "libxml2", "libxslt"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip --version",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
]
paths = ["/opt/venv/bin"]

[start]
cmd = "bash start.sh"
